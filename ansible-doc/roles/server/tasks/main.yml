# Server Setup Tasks
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - vim
      - htop
      - unzip
      - python3-pip
      - nginx
    state: present

- name: Ensure Nginx is running and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes

- name: edit index.html
  ansible.builtin.copy:
    dest: /usr/share/nginx/html/index.html
    content: "<h1>Welcome to the server setup!</h1>"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Restart Nginx to apply changes
  ansible.builtin.service:
    name: nginx
    state: restarted
