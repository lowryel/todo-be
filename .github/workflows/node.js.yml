name: Node.js CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [18.x, 20.x, 22.x, 24.x]

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present
            - run: npm test

    # run-playbook:
    #     runs-on: ubuntu-latest
    #     steps:
    #         - name: Check out the repository to the runner
    #           uses: actions/checkout@v6
    #         - name: Set up Python
    #           uses: actions/setup-python@v4
    #           with:
    #               python-version: "3.x"
    #         - name: Install Ansible
    #           run: |
    #               python -m pip install --upgrade pip
    #               pip install ansible
    #         - name: Run Ansible Playbook
    #           run: ansible-playbook --inventory ./ansible-doc/inventory/server-setup/hosts.ini ./ansible-doc/remote-server-playbook.yml

    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Get EC2 Public IP
              id: ec2
              run: |
                  PUBLIC_IP=$(aws ec2 describe-instances \
                      --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
                      --query "Reservations[0].Instances[0].PublicIpAddress" \
                      --output text)

                  if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
                      echo "EC2 public IP not found"
                      exit 1
                  fi

                  echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

            - name: Configure SSH
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' '${{ secrets.EC2_SSH_PRIVATE_KEY }}' > ~/.ssh/ec2.pem
                  chmod 600 ~/.ssh/ec2.pem

                  ssh-keyscan -H "${{ steps.ec2.outputs.public_ip }}" >> ~/.ssh/known_hosts

            - name: Connect to EC2
              run: |
                  ssh -i ~/.ssh/ec2.pem \
                      ${{ secrets.EC2_USERNAME }}@${{ steps.ec2.outputs.public_ip }} \
                      "echo 'Successfully connected to EC2!'"
