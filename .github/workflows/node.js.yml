name: Ansible Deployment

on:
    push:
        branches:
            - main

    workflow_dispatch:

jobs:
    deploy:
        name: Deploy using Ansible
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Get EC2 Public IP
              id: ec2
              env:
                  INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
              run: |
                  PUBLIC_IP=$(aws ec2 describe-instances \
                    --instance-ids "$INSTANCE_ID" \
                    --query "Reservations[0].Instances[0].PublicIpAddress" \
                    --output text)

                  if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = "None" ]; then
                    echo "Could not retrieve EC2 public IP"
                    exit 1
                  fi

                  echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

            - name: Install Ansible
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ansible

            - name: Configure SSH
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
                  PUBLIC_IP: ${{ steps.ec2.outputs.public_ip }}
              run: |
                  mkdir -p ~/.ssh

                  printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2.pem

                  chmod 600 ~/.ssh/ec2.pem

                  ssh-keyscan -H "$PUBLIC_IP" >> ~/.ssh/known_hosts
            # ssh in to the server
            - name: Configure Ansible Inventory
              env:
                  PUBLIC_IP: ${{ steps.ec2.outputs.public_ip }}
                  SSH_USER: ${{ secrets.EC2_USERNAME }}
              run: |
                  mkdir -p ./ansible-doc/inventory/server-setup

                  cat > ./ansible-doc/inventory/server-setup/hosts.ini <<EOF
                  [webservers]
                  $PUBLIC_IP ansible_user=$SSH_USER ansible_ssh_private_key_file=$HOME/.ssh/ec2.pem
                  EOF

            - name: Run Ansible Playbook
              working-directory: ansible
              run: |
                  ansible-playbook ansible-doc/remote-server-playbook.yml
