name: Node.js CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    run-playbook:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repository to the runner
              uses: actions/checkout@v6
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.x"
            - name: Install Ansible
              run: |
                  python -m pip install --upgrade pip
                  pip install ansible
            - name: Run Ansible Playbook
              run: ansible-playbook --inventory ./ansible-doc/inventory/server-setup/hosts.ini ./ansible-doc/remote-server-playbook.yml
